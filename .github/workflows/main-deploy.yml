name: Deploy React App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build React app
      run: npm run build
      env:
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

    - name: Debug for secrect
      run: |
        echo ${{ secrets.REACT_APP_API_URL }}
        
    - name: Check SSH key exists
      run: |
        if [ -z "${{ secrets.SSH_KEY }}" ]; then
          echo "SSH_KEY is empty"
          exit 1
        else
          echo "SSH_KEY is present"
        fi
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /var/www/react-app-deploy.everythingcanbe.com/html
          rm -rf *
          # Files will be uploaded via rsync
    
    - name: Upload files
      run: |
        rsync -avz --delete ./build/ ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/react-app-deploy.everythingcanbe.com/html/
    
    - name: Restart Nginx
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          sudo systemctl reload nginx
